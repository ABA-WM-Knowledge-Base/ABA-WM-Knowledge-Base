    accessed: "2026-08-08"
    retrieval_hint: Use for pre-decoding latent trajectory transfer, the 18%/19% decode-noise measurement on pseudo-actions, the 70.1-to-72.6 RoboCasa result under its 50-trial five-seed protocol, and the absence of generated-trajectory filtering.

    accessed: "2026-08-03"
    retrieval_hint: Use for exp(-alpha*d) action-state consistency, best-of-8 Consistency-Consensus selection (66.6 to 67.3 against its own reimplemented baseline), the 67.4/68.0 sibling variants, and the static-future failure mode.
    scope: Inference-time selection evidence at 1,200 rollouts with no stated seed count; gains belong to the generator-policy line, not training improvements.

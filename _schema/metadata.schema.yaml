schema_version: 5

page_frontmatter:
  required:
    - id
    - title
    - kind
    - status
    - last_updated
    - owners
  kind:
    - index
    - overview
    - concept
    - paper
    - model
    - reference
    - guide
    - record
  status:
    - reserved
    - draft
    - maintained
    - archived

canonical_topic_page:
  required_heading:
    - Retrieval metadata
  retrieval_fields:
    - Relevant queries
    - Knowledge provided
    - Related pages
  content_rules:
    - Write canonical KB content in English while preserving exact official identifiers and source titles when required.
    - Expose query-to-knowledge associations that support dynamic retrieval.
    - State the concept scope, model family or variant when applicable, and operating conditions for each reusable fact.
    - Connect design implications or optimization advice to a mechanism, controllable surface, expected evidence, risk, and falsification test.
    - Keep local execution observations in the owning entry's reproducible experiment records.
    - Exclude progress narration, reading history, and generic project justification.

foundation_entry:
  required_files:
    - README.md
    - retrieval-index.yaml
    - sources.yaml
  subparts:
    - definitions-and-taxonomy
    - problem-formulation
    - representations
    - learning-objectives
    - decision-making
    - embodied-systems
    - data-and-evaluation
    - research-frontiers

paper_entry:
  required_files:
    - README.md
    - paper.md
    - codebase.md
    - reproduction.md
    - optimization-transfer.md
    - sources.yaml
  active_entries:
    - cosmos-predict2-5

foundation_retrieval_index:
  supported_schema_version: 1
  path: foundations/retrieval-index.yaml
  required:
    - schema_version
    - part_entry
    - entrypoint
    - purpose
    - authority_boundary
    - canonical_owners
    - retrieval_profiles
  profile_required:
    - id
    - related_intents
    - query_terms
    - primary_documents
    - related_documents
    - knowledge_supported

agent_index:
  supported_schema_version: 3
  path: models/cosmos3-nano/agent-index.yaml
  required:
    - schema_version
    - model_entry
    - entrypoint
    - purpose
    - authority_boundary
    - canonical_owners
    - retrieval_profiles
  profile_required:
    - id
    - related_intents
    - query_terms
    - primary_documents
    - additional_documents
    - knowledge_supported

directory_contract:
  content_parts:
    - foundations
    - papers
    - models
  shared_files:
    - README.md
    - INDEX.md
    - CHANGELOG.md
    - _schema
  schema_files:
    - metadata.schema.yaml
    - manifest.schema.yaml
    - sources.schema.yaml
    - naming-conventions.md
    - style-guide.md
    - page-template.md
    - foundation-page-template.md
    - paper-entry-template.md

cosmos3_nano_required_files:
  - README.md
  - agent-index.yaml
  - manifest.yaml
  - architecture.md
  - modalities-and-io.md
  - reasoner.md
  - generator.md
  - action-modeling.md
  - policy.md
  - data.md
  - training.md
  - post-training.md
  - evaluation.md
  - limitations.md
  - codebase.md
  - inference.md
  - reproduction.md
  - optimization-playbook.md
  - research-queue.md
  - sources.yaml

canonical_ownership:
  rules:
    - One page owns the complete reusable explanation of a topic.
    - Dependent pages summarize only the local implication and link to the owner.
    - Reproduction owns execution state; topic pages own stable model knowledge.
    - Optimization references own reusable intervention strategies; research registries own unresolved evidence questions.
    - Retrieved knowledge may influence Agent reasoning and strategy, but retrieval metadata does not define AIBuildAI orchestration, permissions, Agent selection, repository selection, or execution scheduling.

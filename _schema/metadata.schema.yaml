schema_version: 8

page_frontmatter:
  required:
    - id
    - title
    - kind
    - status
    - last_updated
    - owners
  kind:
    - index
    - overview
    - concept
    - paper
    - component
    - model
    - benchmark
    - reference
    - guide
    - record
  status:
    - reserved
    - draft
    - maintained
    - archived

canonical_topic_page:
  required_heading:
    - Retrieval metadata
  retrieval_fields:
    - Relevant queries
    - Knowledge provided
    - Related pages
  content_rules:
    - Write canonical KB content in English while preserving exact official identifiers and source titles when required.
    - Expose query-to-knowledge associations that support dynamic retrieval.
    - State the concept scope, model family or variant when applicable, and operating conditions for each reusable fact.
    - Connect design implications or optimization advice to a mechanism, controllable surface, expected evidence, risk, and falsification test.
    - Keep local execution observations in the owning entry's reproducible experiment records.
    - Exclude progress narration, reading history, and generic project justification.

foundation_entry:

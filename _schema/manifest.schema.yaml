schema_version: 4

manifest:
  required:
    - schema_version
    - id
    - entity_type
    - canonical_name
    - family
    - developer
    - release_date
    - license
    - revisions
    - interfaces
    - reproduction
    - documents
    - last_updated
  entity_type_values:
    - model

identity_artifacts:
  at_least_one_of:
    - checkpoint
    - checkpoints
    - artifacts

revisions:
  minimum_entries: 1

interfaces:
  required:
    - canonical_owner
    - contracts
  contract_required:
    - mode
    - component
    - checkpoint_scope
    - inputs
    - outputs

reproduction:
  required:
    - canonical_owner
    - registry_heading

documents:
  required_routes:
    - overview
    - agent_index
    - reproduction
    - optimization_playbook
    - sources

rules:
  - Treat a product family, downloadable checkpoint, hosted service model, and post-trained checkpoint as separate identities unless an exact equivalence is published.
  - Pin code and checkpoint revisions with complete immutable identifiers when available.
  - Declare how every related checkpoint differs from the reference checkpoint.
  - Use checkpoint, checkpoints, or artifacts to represent the released identity without forcing unlike model families into one checkpoint shape.
  - Resolve document paths relative to the model entry root.
  - Store no mutable execution-state mirror in the manifest; follow reproduction.canonical_owner to the execution-state registry.
  - Keep optimization hypotheses and experiment conclusions out of identity fields.

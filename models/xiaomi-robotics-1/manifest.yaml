  total_parameters: 5.1B
  hosted_revision: not_applicable_no_hosted_service
components:
  vlm:
    approximate_scale: 4.4B
    mechanism: Qwen3-VL-4B-Instruct autoregressive vision-language backbone; input embeddings frozen in post-training
    served_model_id: Qwen/Qwen3-VL-4B-Instruct (backbone loaded by name)
  dit:
    approximate_scale: 604M
    mechanism: 36-layer diffusion transformer attending into the VLM per-layer KV cache; flow matching with 5 Euler steps
  choice_heads:
    approximate_scale: training_only
    mechanism: best-of-5 candidate action regression and score heads on VLM action-token states; absent from HF inference checkpoints
related_checkpoints:
  - model_id: XiaomiRobotics/Xiaomi-Robotics-1-VLABench
    relationship: VLABench fine-tune served in HF format (robot type vlabench_choice, chunk 10); the aibuildai campaign anchor
    reference_revision: f4986843002d86502e2e53079ca06d00a33abffc
  - model_id: XiaomiRobotics/Xiaomi-Robotics-1-RoboCasa
    relationship: RoboCasa fine-tune (robot type robocasa_mg); 74.21% over 2,400 episodes
    reference_revision: not_pinned_in_this_entry
  - model_id: XiaomiRobotics/Xiaomi-Robotics-1-RoboCasa365
    relationship: RoboCasa365 fine-tune; 57.4% average
    reference_revision: not_pinned_in_this_entry
revisions:

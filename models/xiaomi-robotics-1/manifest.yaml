interfaces:
  canonical_owner: modalities-and-io.md
  contracts:
    - mode: hf_action_generation
      component: dit
      checkpoint_scope: Any HF-format benchmark fine-tune served by deploy/server.py
      inputs: [three_images, instruction_text, raw_state_60d, robot_type]
      outputs: [action_chunk_raw_60d]
      backend_constraint: transformers 4.57.1, flash-attn 2, bf16; chunk length comes from the processor action_config of the robot type
    - mode: vlabench_choice
      component: dit
      checkpoint_scope: XiaomiRobotics/Xiaomi-Robotics-1-VLABench
      inputs: [ego_base_wrist_480px, instruction_text, robot_frame_pose_gripper_7d]
      outputs: [per_step_delta_pose_and_absolute_gripper_chunk_10]
    - mode: xr1_trainer
      component: vlm
      checkpoint_scope: XiaomiRobotics/Xiaomi-Robotics-1-5B model_states.pt or an importer-built warm start
      inputs: [episode_json, three_videos, packed_chat_template]
      outputs: [lightning_deepspeed_last_ckpt]
    - mode: async_prefix
      component: dit
      checkpoint_scope: Any checkpoint trained with async_train
      inputs: [executed_action_prefix_1_to_6, observation]
      outputs: [continuation_chunk]
  action_mode_names:
    training: [flow_matching, choice_regression, score_regression, optional_cot_next_token]
    serving: [hf_action_generation]
reproduction:
  canonical_owner: reproduction.md
  registry_heading: Claim registry
optimization_surfaces:

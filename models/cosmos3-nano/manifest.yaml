    - mode: reasoner
      component: reasoner
      checkpoint_scope: Cosmos3-Nano Reasoner component or served Reasoner model
      inputs: [text, optional_image_or_video]
      outputs: [text]
      backend_constraint: Vision input availability is backend and checkpoint-layout specific.
    - mode: text2image
      component: generator
      checkpoint_scope: nvidia/Cosmos3-Nano with compatible Generator backend
      inputs: [text]
      outputs: [image]
    - mode: text2video
      component: generator
      checkpoint_scope: nvidia/Cosmos3-Nano with compatible Generator backend
      inputs: [text]
      outputs: [video]
    - mode: image2image
      component: generator
      checkpoint_scope: nvidia/Cosmos3-Nano with compatible visual-condition adapter
      inputs: [text, image]
      outputs: [image]
    - mode: image2video
      component: generator
      checkpoint_scope: nvidia/Cosmos3-Nano with compatible visual-condition adapter
      inputs: [text, image]
      outputs: [video]
    - mode: video2video
      component: generator
      checkpoint_scope: nvidia/Cosmos3-Nano with compatible visual-condition adapter
      inputs: [text, video]
      outputs: [video]
    - mode: audio_image2video
      component: generator
      checkpoint_scope: nvidia/Cosmos3-Nano with compatible audio and visual adapters
      inputs: [text, image, audio]
      outputs: [video, audio]
    - mode: forward_dynamics
      component: generator
      checkpoint_scope: Base Nano action-enabled configuration and domain adapter
      inputs: [observation, text, action]
      outputs: [future_visual_observation]
    - mode: inverse_dynamics
      component: generator
      checkpoint_scope: Base Nano action-enabled configuration and domain adapter
      inputs: [observation_transition, text, domain_configuration]
      outputs: [action_trajectory]
    - mode: wam
      component: generator
      checkpoint_scope: Base Nano action-enabled configuration and domain adapter
      inputs: [observation, text, domain_configuration]
      outputs: [action_trajectory, visual_rollout]
    - mode: policy_droid
      component: generator
      checkpoint_scope: nvidia/Cosmos3-Nano-Policy-DROID
      inputs: [task_text, droid_proprioception, droid_three_view_canvas]
      outputs: [droid_absolute_joint_position_action_chunk]
  action_mode_names:
    training: [forward_dynamics, inverse_dynamics, policy]
    framework: [forward_dynamics, inverse_dynamics, wam]

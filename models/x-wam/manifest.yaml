interfaces:
  canonical_owner: modalities-and-io.md
  contracts:
    - mode: policy_action
      component: main RGB-state-action branch
      checkpoint_scope: RoboCasa SFT or RoboTwin SFT with matching adapter and normalization config
      inputs: [language_instruction, current_multiview_rgb, current_proprioceptive_state]
      outputs: [future_action_chunk, future_proprioceptive_states]
    - mode: unified_world_prediction
      component: main branch plus depth branch
      checkpoint_scope: pretrained or benchmark SFT checkpoint with Wan2.2 base and matching VAE/text encoder
      inputs: [language_instruction, current_multiview_rgb, current_proprioceptive_state]
      outputs: [future_multiview_rgb, future_multiview_depth, future_proprioceptive_states, future_action_chunk]
    - mode: action_conditioned_video_continuation
      component: main branch after asynchronous action decoding
      checkpoint_scope: checkpoint and config with coupled ANS support
      inputs: [language_instruction, current_multiview_rgb, current_proprioceptive_state, decoded_action_and_state]
      outputs: [continued_future_multiview_rgb, optional_depth]

schema_version: 1
part_entry: world-model-kb.foundations
entrypoint: README.md
purpose: >-
  Associate model-independent world-model queries with canonical Foundation
  knowledge that can ground understanding, diagnosis, design judgment, and
  strategy selection. This index does not define workflow orchestration.

authority_boundary:
  mode: knowledge_guidance_without_orchestration
  knowledge_role: >-
    Expose definitions, formalisms, mechanism families, trade-offs, evaluation
    principles, and unresolved conditions relevant to world-model decisions.
  workflow_authority: >-
    AIBuildAI runtime, orchestrator, Agent configuration, task instructions, and policies
  does_not_define:
    - Agent or repository selection
    - task decomposition, execution order, or scheduling
    - context budgets or mandatory reading sequences
    - permissions, approvals, retries, stopping, or external side effects
    - training, deployment, or benchmark authorization
  integration_note: >-
    AIBuildAI may retrieve and combine any profiles according to the current task
    and state. Profile order carries no priority or execution meaning.

canonical_owners:
  world_model_definition: definitions-and-taxonomy/world-model.md
  historical_lineage_and_taxonomy: definitions-and-taxonomy/history-and-taxonomy.md
  world_foundation_model: definitions-and-taxonomy/world-foundation-model.md
  world_action_model: definitions-and-taxonomy/world-action-model.md
  formal_problem: problem-formulation/problem-formulation.md
  state_observation_and_belief: problem-formulation/state-observation-and-belief.md
  actions_and_interventions: problem-formulation/actions-and-interventions.md
  forward_dynamics: problem-formulation/forward-dynamics.md
  inverse_dynamics: problem-formulation/inverse-dynamics.md
  video_world_models: representations/video-world-model.md
  latent_world_models: representations/latent-world-model.md
  object_centric_world_models: representations/object-centric-world-model.md
  three_d_and_four_d_world_models: representations/3d-and-4d-world-model.md
  representation_learning_and_jepa: representations/representation-learning-and-jepa.md
  autoregressive_modeling: learning-objectives/autoregressive-modeling.md
  diffusion_and_flow_matching: learning-objectives/diffusion-and-flow-matching.md
  planning_and_control: decision-making/planning-and-control.md
  model_based_reinforcement_learning: decision-making/model-based-rl.md
  robotics_and_embodied_ai: embodied-systems/robotics-and-embodied-ai.md
  datasets_and_supervision: data-and-evaluation/datasets-and-supervision.md
  evaluation_methodology: data-and-evaluation/evaluation-methodology.md
  open_research_problems: research-frontiers/open-problems.md
  data_curation_and_filtering: data-and-evaluation/data-curation-and-filtering.md

retrieval_profiles:
  - id: definitions_and_taxonomy
    related_intents:
      - define or delimit a world model
      - distinguish world models, world foundation models, and world action models
      - compare taxonomic axes or historical lineages
    query_terms: [world model definition, taxonomy, world foundation model, world action model, lineage]
    primary_documents:
      - definitions-and-taxonomy/README.md
      - definitions-and-taxonomy/world-model.md
      - definitions-and-taxonomy/history-and-taxonomy.md
      - definitions-and-taxonomy/world-foundation-model.md
      - definitions-and-taxonomy/world-action-model.md
    related_documents:
      model_instantiation:
        - ../models/cosmos3-nano/README.md
        - ../models/cosmos3-nano/action-modeling.md
    knowledge_supported:
      - scoped definitions and invalid equivalences
      - orthogonal classification axes and family relationships
      - terminology conditions that affect model comparison

  - id: problem_formulation
    related_intents:
      - formalize a predictive or action-conditioned world-model task
      - distinguish state, observation, belief, action, and intervention
      - compare forward and inverse dynamics
    query_terms: [problem formulation, state, observation, belief, action, intervention, forward dynamics, inverse dynamics]
    primary_documents:
      - problem-formulation/README.md
      - problem-formulation/problem-formulation.md
      - problem-formulation/state-observation-and-belief.md
      - problem-formulation/actions-and-interventions.md
      - problem-formulation/forward-dynamics.md
      - problem-formulation/inverse-dynamics.md
    related_documents:
      model_instantiation:
        - ../models/cosmos3-nano/modalities-and-io.md
        - ../models/cosmos3-nano/action-modeling.md
    knowledge_supported:
      - variable and conditional-distribution contracts
      - observability, stochasticity, and identifiability assumptions
      - prediction-direction consequences and failure boundaries

  - id: representations
    related_intents:
      - compare pixel, latent, object-centric, geometric, or predictive representations
      - analyze representation bottlenecks or structural priors
      - inspect JEPA-style representation learning
    query_terms: [video world model, latent state, object-centric, 3D, 4D, representation learning, JEPA]
    primary_documents:
      - representations/README.md
      - representations/video-world-model.md
      - representations/latent-world-model.md
      - representations/object-centric-world-model.md
      - representations/3d-and-4d-world-model.md
      - representations/representation-learning-and-jepa.md
    related_documents:
      model_instantiation:
        - ../models/cosmos3-nano/architecture.md
        - ../models/cosmos3-nano/modalities-and-io.md
    knowledge_supported:
      - representation domains and information bottlenecks
      - invariance, equivariance, compositionality, and geometry trade-offs
      - interfaces between learned representations and downstream objectives

  - id: learning_objectives
    related_intents:
      - compare autoregressive, diffusion, rectified-flow, or flow-matching objectives
      - analyze likelihood, denoising, sampling, or rollout trade-offs
      - select an objective family under explicit modeling assumptions
    query_terms: [autoregressive modeling, diffusion, flow matching, rectified flow, denoising, sampling]
    primary_documents:
      - learning-objectives/README.md
      - learning-objectives/autoregressive-modeling.md
      - learning-objectives/diffusion-and-flow-matching.md
    related_documents:
      model_instantiation:
        - ../models/cosmos3-nano/architecture.md
        - ../models/cosmos3-nano/generator.md
        - ../models/cosmos3-nano/training.md
    knowledge_supported:
      - objective and inference-time contracts
      - factorization, conditioning, compute, and error trade-offs
      - falsifiable consequences of objective-family choices

  - id: decision_making
    related_intents:
      - use a learned world model for planning or control
      - compare model predictive control and model-based reinforcement learning
      - analyze horizon, uncertainty, replanning, or model exploitation
    query_terms: [planning, control, MPC, model-based reinforcement learning, policy improvement, imagination]
    primary_documents:
      - decision-making/README.md
      - decision-making/planning-and-control.md
      - decision-making/model-based-rl.md
    related_documents:
      model_instantiation:
        - ../models/cosmos3-nano/action-modeling.md
        - ../models/cosmos3-nano/policy.md
    knowledge_supported:
      - decision-time use of learned predictions
      - horizon, uncertainty, objective, and replanning trade-offs
      - model-bias and model-exploitation failure modes

  - id: embodied_systems
    related_intents:
      - connect a world model to a robot or embodied agent
      - reason about sensors, action spaces, controllers, timing, or sim-to-real transfer
      - inspect closed-loop deployment risks
    query_terms: [robotics, embodied AI, controller, action space, observation stack, closed loop, sim-to-real]
    primary_documents:
      - embodied-systems/README.md
      - embodied-systems/robotics-and-embodied-ai.md
    related_documents:
      model_instantiation:
        - ../models/cosmos3-nano/modalities-and-io.md
        - ../models/cosmos3-nano/action-modeling.md
        - ../models/cosmos3-nano/policy.md
    knowledge_supported:
      - embodiment-specific observation, action, timing, and controller contracts
      - open-loop versus closed-loop capability boundaries
      - deployment, distribution-shift, and sim-to-real risks

  - id: data_and_evaluation
    related_intents:
      - design a world-model dataset or supervision mixture
      - define an evaluation protocol or interpret a metric
      - diagnose leakage, confounding, rollout drift, or physical inconsistency
    query_terms: [dataset, supervision, curation, benchmark, metric, evaluation, calibration, rollout error]
    primary_documents:
      - data-and-evaluation/README.md
      - data-and-evaluation/datasets-and-supervision.md
      - data-and-evaluation/evaluation-methodology.md
      - data-and-evaluation/data-curation-and-filtering.md

    related_documents:
      model_instantiation:
        - ../models/cosmos3-nano/data.md
        - ../models/cosmos3-nano/evaluation.md
        - ../models/cosmos3-nano/reproduction.md
    knowledge_supported:
      - data composition, coverage, contamination, and supervision principles
      - capability-aligned metrics and controlled comparison requirements
      - evidence limits for perceptual, physical, predictive, and control claims

  - id: research_frontiers
    related_intents:
      - identify unresolved world-model assumptions or evidence gaps
      - connect an open question to its canonical concept owner
      - formulate a falsifiable cross-model research hypothesis
    query_terms: [open problem, unresolved question, research gap, hypothesis, uncertainty, scaling]
    primary_documents:
      - research-frontiers/README.md
      - research-frontiers/open-problems.md
    related_documents:
      model_instantiation:
        - ../models/cosmos3-nano/limitations.md
        - ../models/cosmos3-nano/research-queue.md
        - ../models/cosmos3-nano/optimization-playbook.md
    knowledge_supported:
      - unresolved conditions with decision consequences
      - cross-cutting hypotheses and falsification targets
      - links from open questions to established canonical knowledge
